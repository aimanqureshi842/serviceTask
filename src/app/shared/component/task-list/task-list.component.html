<ul class="list-group" *ngIf="taskList.length>0 ;else notodo">
    <li class="list-group-item d-flex justify-content-between" *ngFor="let task of taskList; trackBy:trackById">
        <strong>{{task.taskTitle}}</strong>
        <div>
            <button mat-raised-button color="primary" class="mr-3">Edit</button>
            <button mat-raised-button color="warn">Remove</button>
        </div>
    </li>
</ul>

<ng-template #notodo>
    <p class="alert alert-info"> No task added yet ,Add to let go !</p>
</ng-template>
