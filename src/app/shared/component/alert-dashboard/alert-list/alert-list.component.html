<ul class="list-group" *ngIf="alerArr.length>0;else noalert">
    <li class="list-group-item d-flex justify-content-between" *ngFor="let alert of alerArr ;trackBy:trackById">
        <strong>{{alert.alertMessage}}</strong>
        <div>
            <button mat-raised-button color="primary" class="mr-2">Edit</button>
            <button mat-raised-button color="warn">Remove</button>

        </div>
    </li>
</ul>
<ng-template #noalert>
    <p class="alert alert-info"> No alert added !</p>
</ng-template>
